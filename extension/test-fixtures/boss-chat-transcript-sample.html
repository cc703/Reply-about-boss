<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>BOSS Chat Transcript Sample</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: #eef7f8;
      }

      .boss-chat-page {
        width: 980px;
        margin: 24px auto;
        background: #fff;
      }

      .chat-stream {
        padding: 32px;
      }

      .chat-time {
        text-align: center;
        color: #a8adb3;
      }

      .chat-message {
        display: flex;
        margin: 16px 0;
      }

      .item-friend {
        justify-content: flex-start;
      }

      .item-myself {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 560px;
        padding: 12px 16px;
        border-radius: 6px;
        background: #f6f7f8;
      }

      .item-myself .bubble {
        background: #c9f1f1;
      }

      .job-card,
      .analysis-card {
        margin: 16px auto;
        width: 420px;
        padding: 16px;
        border: 1px solid #d7e3ff;
        background: #eef4ff;
      }

      .dialog-action {
        margin: 12px 0;
      }

      .assistant-panel {
        position: fixed;
        right: 24px;
        top: 24px;
        width: 280px;
        padding: 16px;
        background: #fff;
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <main class="boss-chat-page">
      <section class="chat-stream">
        <div class="chat-time">07-20 11:34</div>
        <div class="chat-message item-friend">
          <div class="bubble text">终于等到优秀的你了，期待你的加入。</div>
        </div>
        <div class="analysis-card">
          <div>你与该职位竞争者PK情况</div>
          <button type="button">查看详细分析</button>
        </div>
        <div class="dialog-action resume-btn" role="button">发简历</div>
        <div class="chat-message item-myself">
          <div class="bubble text">你好，可以了解一下岗位要求。</div>
        </div>
        <div class="read-status">已读</div>
        <div class="chat-message item-friend">
          <div class="bubble text">你对 Python 和 FastAPI 掌握程度怎么样</div>
        </div>
      </section>
    </main>
    <aside class="assistant-panel">
      <div>沟通</div>
      <div>BOSS</div>
      <div>智能对话 · 高效沟通</div>
      <div>[13:47:54] 欢迎使用海投助手，我将自动发送简历!</div>
      <div>© 2026 Yangshengzhou · All Rights Reserved.</div>
    </aside>
  </body>
</html>
